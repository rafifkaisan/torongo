SOURCE FILE 2 — REPAIR_COVERAGE_MATRIX.pdf (12 PAGES)
TORONGO — REPAIR COVERAGE MATRIX
This matrix separates automatic source changes, honest feature mitigations, and functionality that cannot be truthfully created
from the supplied client-side prototype alone.
A. INCLUDED IN THE GITHUB AUTOMATION
Source columns: Area; Workflow action; What this does and does not mean.
A01. Repository layout
Workflow action: Extracts the existing ZIP into app/, docs/, archive/ and restores packaged root metadata where absent; verifies
SHA-256 entries against FILE_MANIFEST.txt.
What this does and does not mean: Fixes the missing expected source/doc paths if the committed ZIP and manifest pass
integrity checks. It does not validate the app runtime.
A02. README and docs links
Workflow action: Rebuilds root README and docs/ documentation; aligns root copies; reconciles feature status, source
descriptions, setup and release checklist.
What this does and does not mean: Makes documentation paths and statements consistent with the recovered package and
eight-feature names.
A03. Eight-feature navigation
Workflow action: Ensures the Community route is represented in the Home feature array if the guarded insertion pattern
matches. Labels Advisor as a static guide and Community as a local demo.
What this does and does not mean: A visible eighth card is not the same as a complete production feature. Any unmatched
source pattern is reported as REVIEW.
A04. NASA GIBS identifiers
Workflow action: Removes the obsolete _12Day suffix from the NISAR GCOV and OPERA RTC layer identifiers. Adds a live
GetCapabilities name check.
What this does and does not mean: Confirms layer names are present in NASA's capabilities response at run time. It does not
prove a valid GetMap image for every date/AOI.
A05. CMR main query
Workflow action: Removes the global fallback; passes and preserves the actual selected area ID; does not fabricate
NASA-GRANULE or 2026-10-22; marks coverage unverified; distinguishes request failure (null) from a valid empty array.
What this does and does not mean: A bounding-box query is still only a search/intersection hit. No full-coverage percentage is
claimed.
A06. CMR monthly calendar
Workflow action: Removes default-area/global assumptions where guarded patterns match; prevents fake ID/date and false
coverage labels; separates monthly request failure from a genuine empty month.
What this does and does not mean: It still does not calculate granule-footprint intersection percentage against the AOI polygon.
A07. Scene selection
Workflow action: Carries requested Before/After dates into SkyFound, avoids silently substituting a missing requested scene,
flags multiple records on the same requested date and calculates an actual calendar-day gap.
What this does and does not mean: The 30-day threshold is a UI screening rule only. It is not a scientific pair-match
certification. No pair can be marked fully suitable while AOI coverage remains unverified.
TORONGO — combined PDF extraction Page 4
A08. NISAR gap
Workflow action: Displays the recorded 27 July 2026 22:03:25 UTC–10 August 2026 00:55:27 UTC acquisition gap in calendar
and Trust Ledger contexts, where source patterns match.
What this does and does not mean: Missing imagery is represented as a known data gap, not as evidence of no surface
change.
A09. Delta / rainfall
Workflow action: Clears schematic time-series defaults and false zero-valued island trend data; removes the PRECTOTCORR
> 8 flood flag; renames Sentinel-1 scene count so it is not a flood-observation count; clears stale rainfall context on a new sync.
What this does and does not mean: NASA POWER precipitation remains contextual estimated rainfall, not a flood detector or
measured water extent.
A10. Map layer control
Workflow action: Renames the Islands state/prop to the UI's actual True Color layer and makes it show/hide the MODIS
backdrop. Clarifies that OPERA DSWx-S1 is a browse water-extent layer, not a flood classification.
What this does and does not mean: Does not create a computed char/island map or risk classification.
A11. Duet Differences
Workflow action: Prevents the diff route from loading the OPERA DSWx-S1 water layer as a sensor-difference map; hides the
unvalidated Difference view/stat block and shows Not tested when the guarded UI pattern matches.
What this does and does not mean: Does not create co-registered L-band/C-band masks, disagreement, IoU or kappa.
A12. Spot Check
Workflow action: Re-labels the pin as a screen-relative display pin and explicitly tells the user there is no geographic coordinate
or SAR pixel sample.
What this does and does not mean: Does not implement map projection conversion or real pixel extraction.
A13. Trust Ledger
Workflow action: Adds the documented NISAR acquisition-gap context and aligns documentation of product
source/maturity/limitations.
What this does and does not mean: Full per-result processing provenance still needs a pipeline and actual outputs.
A14. Evidence Brief
Workflow action: Expands exported HTML to include optional browse map, scene IDs, date/method notes, available
metrics/limitations and optional population limitation note; removes static priority-place presentation; separates
print/share/unavailable/failure UI state.
What this does and does not mean: Still cannot include actual calculations that the app does not perform. Sharing-sheet
closure does not prove the recipient received the file.
A15. Advisor
Workflow action: Replaces the ID-only check with an exact cited-library-excerpt inclusion check, where the expected helper
exists; labels the UI accurately as a static keyword guide.
What this does and does not mean: This is not semantic entailment, factual validation, numeric verification, or a generative AI
backend.
A16. Community
Workflow action: Fixes zero-results list fallback; shows a no-results state; disables fake snapshot upload and best-answer
action; clears sample snapshot metadata; exposes local-only/auth/reporting limitations and sample labels.
What this does and does not mean: Does not create authenticated accounts, cross-device persistence, moderation or
server-side rate limits.
TORONGO — combined PDF extraction Page 6
B07. Generative AI Advisor
Why the workflow cannot safely claim it is fixed: No secured model/backend integration is present. The new helper only
checks for exact text from the source library.
Required real work: Build a server-side model/retrieval service; keep keys off-device; validate numerical claims against
structured results; enforce citations/refusal policy; test English and Bangla.
B08. Production Community Page
Why the workflow cannot safely claim it is fixed: The app stores posts in local memory and has no server/auth/moderation
infrastructure.
Required real work: Add auth, persistent database, authorization, server-side rate limits, real file upload, moderator queues,
report records and role-based best-answer permissions.
B09. Complete UI/end-to-end verification
Why the workflow cannot safely claim it is fixed: No source-text patch can prove touch targets, render states, gestures,
Android-specific sharing, or accessibility work on real devices.
Required real work: Run the app on Android and web; test every route/button/toggle/filter/date/error/export state and all
navigation links.
B10. NASA image retrieval for all AOIs/dates
Why the workflow cannot safely claim it is fixed: GetCapabilities verifies layer names, not each WMS image response.
Required real work: Test GetMap response status/content-type and inspect returned images for each date/extent/resolution
actually used.
B11. Ground truth and uncertainty
Why the workflow cannot safely claim it is fixed: No independent ground-truth files or calibration set were supplied.
Required real work: Obtain suitable reference data, define sampling protocol and validation metrics, and report
uncertainty/limitations.
C. REQUIRED HUMAN SIGN-OFF BEFORE RELEASE
1. Review docs/REPAIR_REPORT.md; every REVIEW item remains open until manually inspected.
2. Review GitHub Actions logs for dependency install, Expo Doctor, web export and NASA GetCapabilities.
3. Merge the pull request only after checking its file diff.
4. Clone the merged repository and repeat a clean install/build.
5. Test Android and web navigation, date selections, map layers, language switching, PDF export/print/share and Community
empty states.
6. Verify the linked demo video in a signed-out browser for reachability, visibility and duration. The automation cannot verify
ownership, final edit or event acceptance.
