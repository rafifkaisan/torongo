SOURCE FILE 1 — README_FIRST.pdf
TORONGO REPAIR PACKAGE — START HERE
Single manual addition: add .github/workflows/torongo-repair.yml to rafifkaisan/torongo.
After that, GitHub Actions performs the repository-side repair and opens a separate pull request. You review
docs/REPAIR_REPORT.md and merge the PR. The workflow never auto-merges into main.
CONTENTS OF THIS PACKAGE
• .github/workflows/torongo-repair.yml — the one file to add to GitHub.
• STEP_BY_STEP_GITHUB_GUIDE.md — every screen and action, including permissions and troubleshooting.
• REPAIR_COVERAGE_MATRIX.md — what is automatically changed, what is only mitigated, and what still needs real
engineering.
IMPORTANT
The workflow restores the app/docs source, applies guarded corrections, aligns the eight-feature documentation, checks GIBS
layer names and attempts Expo checks. It does not create satellite raster processing, independent validation data, a real AI
backend, or a production Community backend. Any source pattern not found is marked REVIEW.
